[package]
name = "helix-gui"
version = "1.0.0"
edition = "2021"
description = "v5 design language gui for the helix key manager"

[dependencies]
eframe = { version = "0.31", features = ["wayland"] }
# the audio backend needs libasound2-dev; without it the build still
# works and the engine degrades to a silent backend
cpal = { version = "0.15", optional = true }

[features]
audio = ["cpal"]
default = []

[build-dependencies]
cc = "1"

[profile.release]
lto = true
